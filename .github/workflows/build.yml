name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: sh -n entrypoint.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SMOKE_TAG: discord-author-watcher:smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Erst lokal bauen und das fertige Image prüfen, bevor etwas veröffentlicht wird.
      - name: Build smoke-test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_TAG }}

      - name: Unit tests with the image's Python
        run: |
          docker run --rm --entrypoint python3 -v "$PWD:/src:ro" -w /src "$SMOKE_TAG" \
            -m unittest discover -s tests -v

      - name: Self-test as PUID/PGID with dropped capabilities
        run: |
          data="$(mktemp -d)"
          sudo chown 1234:1234 "$data" && sudo chmod 0700 "$data"
          docker run --rm \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --security-opt no-new-privileges=true --memory=512m --pids-limit=256 \
            -v "$data:/data" "$SMOKE_TAG" --self-test | tee self-test.log
          grep -q 'uid=99 gid=100' self-test.log
          test "$(sudo stat -c '%u:%g' "$data")" = "99:100"

      - name: Missing configuration fails cleanly
        run: |
          if docker run --rm -v "$(mktemp -d):/data" "$SMOKE_TAG" 2> err.log; then exit 1; fi
          grep -q 'Konfigurationsfehler' err.log

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/cosmicflow2512/discord-author-watcher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
