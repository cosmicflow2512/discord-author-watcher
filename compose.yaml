services:
  discord-author-watcher:
    image: ghcr.io/cosmicflow2512/discord-author-watcher:latest
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - /mnt/cache/appdata/discord-author-watcher:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Nur für den Start: /data übernehmen und auf PUID/PGID wechseln.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
