services:
  discord-author-watcher:
    image: ghcr.io/cosmicflow2512/discord-author-watcher:latest
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - /mnt/cache/appdata/discord-author-watcher:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
